spring.application.name=juniemvc

# enable color output in the console
spring.output.ansi.enabled=always


# Database Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# enable SQL-Syntax-Highlighting in the console
spring.jpa.properties.hibernate.highlight_sql=true
# H2 Console Configuration (for development)
spring.h2.console.enabled=true

# H2 Database Configuration
#spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL

# Disable Open Session in View pattern,
# Also prevent the warning in the App logs
spring.jpa.open-in-view=false

# Flyway Configuration
# is not needed since default value
# spring.flyway.enabled=true
# spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
