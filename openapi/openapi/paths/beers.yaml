get:
  tags:
    - Beer
  summary: List beers
  description: "Returns a paged list of beers with optional filtering by beerName and beerStyle."
  operationId: listBeers
  security:
    - api_key: []
  parameters:
    - in: query
      name: beerName
      required: false
      schema:
        type: string
      description: Optional beer name filter (case-insensitive, substring match)
    - in: query
      name: beerStyle
      required: false
      schema:
        type: string
      description: Optional beer style filter (case-insensitive, substring match)
    - in: query
      name: page
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Zero-based page index (0..N). Defaults to 0 if not provided.
    - in: query
      name: size
      required: false
      schema:
        type: integer
        minimum: 1
        default: 20
      description: The size of the page to be returned. Defaults to 20 if not provided
    - in: query
      name: sort
      required: false
      schema:
        type: array
        items:
          type: string
      description: "Sorting criteria in the format: property(,asc|desc). Default sort order is ascending. Multiple sort criteria are supported."
      style: form
      explode: false
  responses:
    '200':
      description: "Successfully retrieved a page of beers"
      content:
        application/json:
          schema:
            type: object
            properties:
              content:
                type: array
                items:
                  $ref: '../components/schemas/BeerDto.yaml'
              totalElements:
                type: integer
              totalPages:
                type: integer
              size:
                type: integer
              number:
                type: integer
          example:
            content:
              - id: 1
                version: 0
                createdDate: "2023-01-01T12:00:00Z"
                updateDate: "2023-01-01T12:00:00Z"
                beerName: "Mango Bobs"
                beerStyle: "IPA"
                upc: "0631234200036"
                quantityOnHand: 100
                price: 12.99
            totalElements: 1
            totalPages: 1
            size: 10
            number: 0
    '400':
      description: "Bad request"
    '401':
      description: "Unauthorized"
post:
  tags:
    - Beer
  summary: Create a new beer
  description: "Creates a new beer in the system. The ID, version, createdDate, and updateDate fields will be ignored if provided."
  operationId: createBeer
  security:
    - api_key: []
  requestBody:
    description: "Beer object to be created"
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/BeerDto.yaml'
        example:
          beerName: "New Beer"
          beerStyle: "LAGER"
          upc: "0631234500033"
          quantityOnHand: 50
          price: 9.99
  responses:
    '201':
      description: "Successfully created a new beer"
      content:
        application/json:
          schema:
            $ref: '../components/schemas/BeerDto.yaml'
          example:
            id: 3
            version: 0
            createdDate: "2023-01-03T15:00:00Z"
            updateDate: "2023-01-03T15:00:00Z"
            beerName: "New Beer"
            beerStyle: "LAGER"
            upc: "0631234500033"
            quantityOnHand: 50
            price: 9.99
    '400':
      description: "Bad request - validation error"
    '401':
      description: "Unauthorized"
