type: object
description: "Data Transfer Object for Beer Order"
required:
  - beerOrderLines
  - paymentAmount
properties:
  id:
    description: "Unique identifier for the beer order. Read-only field generated by the system."
    type: integer
    format: int32
    readOnly: true
    example: 1001
  version:
    description: "Version number for optimistic locking. Read-only field incremented on each update."
    type: integer
    format: int32
    readOnly: true
    example: 0
  createdDate:
    description: "Date and time when the beer order was created. Read-only field."
    type: string
    format: date-time
    readOnly: true
    example: "2023-01-01T12:00:00Z"
  updateDate:
    description: "Date and time when the beer order was last updated. Read-only field."
    type: string
    format: date-time
    readOnly: true
    example: "2023-01-02T14:30:00Z"
  customerRef:
    description: "Reference information from a customer."
    type: string
    example: "PO-12345"
  paymentAmount:
    description: "Payment amount for the order. Must be positive."
    type: number
    format: decimal
    exclusiveMinimum: 0
    example: 49.99
  status:
    description: "Status of the order (e.g., NEW, PAID, CANCELLED, INPROCESS, COMPLETE)."
    type: string
    example: "NEW"
  beerOrderLines:
    description: "Set of beer order line items. Must contain at least one line."
    type: array
    minItems: 1
    items:
      $ref: '../schemas/BeerOrderLineDto.yaml'